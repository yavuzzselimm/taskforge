spring:
  application:
    name: taskforge
  datasource:
    url: jdbc:postgresql://localhost:5433/taskforge
    username: taskforge
    password: taskforge
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true

taskforge:
  worker:
    enabled: true
    poll-interval-ms: 1000
    lease-seconds: 30