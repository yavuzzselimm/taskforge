spring:
  application:
    name: taskforge
  datasource:
    url: jdbc:postgresql://localhost:5433/taskforge
    username: taskforge
    password: taskforge
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true

taskforge:
  worker:
    enabled: true
    poll-interval-ms: 1000
    poll-jitter-ms: 200
    lease-seconds: 30
    threads: 4
    shutdown-timeout-seconds: 20

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
